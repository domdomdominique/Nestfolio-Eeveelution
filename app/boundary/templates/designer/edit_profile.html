{% extends "base.html" %}
{% from "shared/_phone.html" import phone_input %}
{% block content %}

<h1>Edit my profile</h1>

<form method="post">
  <input
    type="hidden"
    name="csrf_token"
    value="{{ csrf_token() }}"
  >

  <label>
    Full name *
    <input
      name="name"
      required
      maxlength="100"
      autocomplete="name"
      value="{{ form.get('name', '') }}"
    >
  </label>

  <label>
    Email address *
    <input
      name="email"
      type="email"
      required
      maxlength="120"
      autocomplete="email"
      value="{{ form.get('email', '') }}"
    >
  </label>

  <label>
    Phone number *
    {{ phone_input(form.get('phone', '')) }}
  </label>

  <p>
    If you change your email address, use the updated
    email the next time you log in.
  </p>

  <button type="submit">Save changes</button>

  <a href="{{ url_for('designer.profile') }}">
    Cancel
  </a>
</form>

{% endblock %}
